<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">ShopEase</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
            <span class="cart">🛒 Cart (<span id="cart-count">0</span>)</span>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div>
            <h1>Shop Smart, Live Better!</h1>
            <p>Discover amazing products at the best prices.</p>
            <button onclick="scrollToProducts()">Shop Now</button>
        </div>
    </section>

    <!-- Search Bar -->
    <section class="search-section">
        <input
            type="text"
            id="search"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >
    </section>

    <!-- Products -->
    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <div class="product-container" id="product-container">

            <div class="product-card">
                <img src="https://placehold.co/300x220?text=Smartphone"
                     alt="Smartphone">

                <h3>Smartphone</h3>
                <p>₹15,999</p>

                <button onclick="addToCart('Smartphone', 15999)">
                    Add to Cart
                </button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x220?text=Headphones"
                     alt="Headphones">

                <h3>Headphones</h3>
                <p>₹1,499</p>

                <button onclick="addToCart('Headphones', 1499)">
                    Add to Cart
                </button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x220?text=Sneakers"
                     alt="Sneakers">

                <h3>Sneakers</h3>
                <p>₹2,999</p>

                <button onclick="addToCart('Sneakers', 2999)">
                    Add to Cart
                </button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x220?text=Backpack"
                     alt="Backpack">

                <h3>Backpack</h3>
                <p>₹999</p>

                <button onclick="addToCart('Backpack', 999)">
                    Add to Cart
                </button>
            </div>

        </div>
    </section>

    
    <section class="cart-section">

        <h2>Your Cart</h2>

        <ul id="cart-items"></ul>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button onclick="checkout()">Checkout</button>

    </section>

    
    <footer id="contact">
        <p>© 2026 ShopEase | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
