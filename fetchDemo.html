<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Fetch</title>
  <style>
    table {
      width: 80vw;
      border: 2px solid green;
      border-collapse: collapse;
    }
    th, td {
      border: 2px solid red;
      padding: 8px;
      text-align: center;
    }
    img {
      width: 80px;  
      height: auto;
    }
    button {
      padding: 6px 12px;
      background-color: orange;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: darkorange;
    }
  </style>
</head>
<body>
  <h1><center>List of Products</center></h1>
  <table>
    <thead>
      <tr>
        <th>Sr.No.</th>
        <th>Title</th>
        <th>Image</th>
        <th>Category</th>
        <th>Rating</th>
        <th>Price (INR)</th>
        <th>Stock</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>

  <script>
    async function getProducts() {
      const URL = "https://dummyjson.com/products?limit=50&skip=5";
      const USD_TO_INR = 95.695021;
      try {
        const res = await fetch(URL);
        const data = await res.json();
        console.log("data=", data.products);

        let rows = "";
        data.products.map((i, index) => {
          rows += `
            <tr>
              <td>${index + 1}</td>
              <td>${i.title}</td>
              <td><img src="${i.thumbnail}" alt="${i.title}"></td>
              <td>${i.category}</td>
              <td>${i.rating}</td>
              <td>₹${(i.price * USD_TO_INR).toFixed(2)}</td>
              <td>${i.stock}</td>
              <td><button onclick="addToCart('${i.id}', '${i.title}')">Add to Cart</button></td>
            </tr>`;
        });

        document.getElementById("data").innerHTML = rows;
      } catch (err) {
        console.log("Error:", err);
      }
    }

    function addToCart(id, title) {
      alert(`Product "${title}" (ID: ${id}) added to cart!`);
      
    }

    getProducts();
  </script>
</body>
</html>
